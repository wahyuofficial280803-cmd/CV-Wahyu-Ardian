<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />

  <!-- Ambient circles -->
  <circle cx="80" cy="80" r="120" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="340" cy="320" r="140" fill="#ec4899" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="180" r="130" fill="none" stroke="url(#primaryGlow)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Silhouette Body -->
  <path d="M120 370 C120 290 150 265 200 265 C250 265 280 290 280 370 Z" fill="#1e293b" stroke="#475569" stroke-width="3" />
  <!-- Shirt details -->
  <path d="M175 265 L200 310 L225 265" fill="none" stroke="url(#primaryGlow)" stroke-width="3" />
  <path d="M200 310 L200 370" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Head -->
  <circle cx="200" cy="190" r="58" fill="#334155" stroke="url(#accentGrad)" stroke-width="3" />

  <!-- Hair / Modern Stylist Cut -->
  <path d="M145 185 C145 130 170 125 200 125 C235 125 255 140 255 185 C245 155 220 145 200 145 C175 145 155 160 145 185 Z" fill="#0f172a" />

  <!-- Glasses -->
  <rect x="160" y="180" width="32" height="20" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <rect x="208" y="180" width="32" height="20" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <line x1="192" y1="190" x2="208" y2="190" stroke="#38bdf8" stroke-width="3" />

  <!-- Smile / Expression -->
  <path d="M188 222 Q200 230 212 222" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Camera / Creative Badge floating -->
  <g transform="translate(260, 240) scale(0.9)">
    <rect x="0" y="8" width="60" height="42" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="2.5" />
    <circle cx="30" cy="29" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="30" cy="29" r="7" fill="#6366f1" />
    <rect x="10" y="0" width="16" height="8" rx="2" fill="#ec4899" />
    <circle cx="48" cy="18" r="3" fill="#fbbf24" />
  </g>

  <!-- Pen tool / Vector node floating -->
  <g transform="translate(65, 230) scale(0.9)">
    <circle cx="20" cy="20" r="24" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <path d="M10 30 L22 12 L30 20 L16 32 Z" fill="#818cf8" />
    <path d="M22 12 L28 6 L34 12 L28 18 Z" fill="#ec4899" />
    <circle cx="20" cy="20" r="2" fill="#ffffff" />
  </g>

  <!-- Initials Tag -->
  <rect x="130" y="325" width="140" height="34" rx="17" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="2" />
  <text x="200" y="347" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">WAHYU ARDIAN</text>
</svg>
