<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="familyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#familyGrad)" />
  <circle cx="150" cy="100" r="130" fill="#34d399" opacity="0.15" />

  <!-- CMYK / Print Design Elements -->
  <g transform="translate(300, 150) scale(1.1)">
    <!-- Cyan -->
    <circle cx="-35" cy="-20" r="38" fill="#00ffff" opacity="0.5" />
    <!-- Magenta -->
    <circle cx="35" cy="-20" r="38" fill="#ff00ff" opacity="0.5" />
    <!-- Yellow -->
    <circle cx="0" cy="30" r="38" fill="#ffff00" opacity="0.5" />
    <!-- Center key -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
  </g>

  <rect x="50" y="270" width="165" height="30" rx="15" fill="#047857" />
  <text x="132" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PRINT & GRAPHIC DESIGN</text>

  <text x="50" y="335" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Family Printing Publications</text>
  <text x="50" y="365" font-family="system-ui, sans-serif" font-size="14" fill="#d1fae5">Banner, Spanduk, Brosur, Stiker & Desain Pra-Cetak (2021-2022)</text>
</svg>
