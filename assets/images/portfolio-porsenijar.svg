      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#porsenijarGrad)" />
  <circle cx="500" cy="80" r="140" fill="#38bdf8" opacity="0.15" filter="blur(30px)" />
  
  <!-- Camera Shutter Symbol -->
  <g transform="translate(300, 160) scale(1.4)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#38bdf8" stroke-width="4" />
    <circle cx="0" cy="0" r="42" fill="#0369a1" opacity="0.4" />
    <path d="M-25 -25 L25 -25 L0 30 Z" fill="#38bdf8" opacity="0.7" />
