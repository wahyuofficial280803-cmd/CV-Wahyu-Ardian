  <text x="50" y="335" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Dokumentasi Media Porsenijar 2026</text>
  <text x="50" y="365" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">Panitia PGRI Provinsi Riau • Liputan Lapangan & Visual Storytelling</text>
